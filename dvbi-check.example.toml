# Example configuration for dvbi-check
# Usage: dvbi-check run <URL> --config dvbi-check.toml
# Command line options override values from this file.
# The sections are for structure only.

[http]
# A service list may only be delivered to certified receivers (Book 11.1: User-Agent allowlist).
# Enter the whitelisted User-Agent here, otherwise the server may answer with 403.
user_agent = "dvbi-check/0.1 (Readiness Check)"
timeout = 10.0
retries = 1
workers = 8
# postcode = "06217"          # server-side regionalisation (?postcode=)

[profile]
profile = "de"                 # "de" = DVB-I Book Germany + DTVP, "a177" = standard only
# Hosts of the service list provider's content guide proxy (Book 12 / DTVP IT-17).
# If the list is empty, the hosts are only listed, not assessed.
cg_proxy_hosts = []
check_server_features = true   # test invalid postcode (IT-5) and conditional GET (IT-18)
server_test_postcode = "10115"
invalid_postcode = "00000"

[contentguide]
# cg_max_services = 20         # for quick runs only the first N services
cg_days_past = 7               # DTVP IT-6: 7 days back "should"
cg_days_future = 7             # DTVP IT-6: today + 7 days "shall"
cg_timezone = "Europe/Berlin"
cg_min_coverage = 0.9
cg_max_gap_minutes = 5
cg_slow_seconds = 2.0
cg_image_sample = 2

[images]
logo_width = 320               # DTVP IT-6 "shall"
logo_max_bytes = 65536         # 64 kB, "should"
epg_image_width = 640          # DTVP IT-6 "shall"
epg_image_max_bytes = 102400   # 100 kB, "should"
image_variant_param = "image_variant"
image_width_param = "w"
logo_variants_mandatory = ["16x9_colour", "16x9_colour_light", "16x9_colour_dark"]
check_optional_variants = false

[ait]
# ait_xsd = "schemas/mis_xmlait.xsd"   # optional: XML AIT schema from ETSI TS 102 809
ait_check_app_url = true               # fetch the application entry page

[mpd]
mpd_min_width = 960                    # Book 7.3: minimum quality 960x540p
mpd_min_height = 540
mpd_min_bandwidth = 2500000            # Book 7.3: > 2.5 Mbit/s
mpd_slow_seconds = 2.0
check_hls = true

[refval]
# DVB-I reference validator (paulhiggs/dvb-i-tools), opt-in.
# The complete service list is POSTed to this server – only enable it if that is acceptable.
# refval_url = "https://<host>:<port>"
refval_timeout = 300.0
# The DE variant is requested via the header "X-variants: DE" (dvb-i-tools from 2026-10-22).
# For older validator instances that ignore it, let dvbi-check relax DE-permitted findings:
refval_relax_de = false
